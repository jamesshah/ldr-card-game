name: LDRCards
options:
  bundleIdPrefix: com.jamesshah
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LDRCards:
    type: application
    platform: iOS
    sources:
      - path: LDRCards
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: LDR Cards
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CONVEX_URL: $(CONVEX_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        NSMicrophoneUsageDescription: Record a voice note as proof you completed a card.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesshah.ldrcards
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
    scheme:
      testTargets:
        - LDRCardsTests

  LDRCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LDRCardsTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesshah.ldrcards.tests
    dependencies:
      - target: LDRCards

  LDRCardsSmokeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LDRCardsSmokeUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesshah.ldrcards.smokeuitests
        TEST_TARGET_NAME: LDRCards
    dependencies:
      - target: LDRCards

schemes:
  LDRCardsSmoke:
    build:
      targets:
        LDRCards: all
        LDRCardsSmokeUITests: [test]
    test:
      targets:
        - LDRCardsSmokeUITests
